<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Guia Completo para Iniciantes em Apostas">
  <meta name="twitter:description" content="Aprenda a apostar online com segurança!">
  <meta name="twitter:image" content="https://guia-apostas-mz.vercel.app/guia.webp">
  <link rel="icon" href="icon.webp" type="image/webp">
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@4.0.2/dist/tesseract.min.js"></script>

  <style>

  </style>
</head>
<body>
  <div class="chat-container">
    <div class="chat-header"><h1>Assistente Paulo</h1></div>
    <div class="messages" id="messages">
      <div class="message bot-message">Olá, em que posso ajudar?</div>
    </div>
    <div class="questions" id="questions">
      <button class="question-btn" onclick="selectQuestion(this,1)">Olá, Quero receber o guia de apostas e casino online.</button>
      <button class="question-btn" onclick="selectQuestion(this,2)">Olá, quero saber sobre o guia.</button>
    </div>
  </div>

  <script>
    const questionsData = {
      1: {
        followUp: { options: [
          { text:'Sim', value:101 },
          { text:'Não', value:102 },
          { text:'Voltar ao menu principal', value:0 }
        ] }
      },
      2: {
        answer: 'Ótimo, o guia de apostas online é a melhor guia que você pode conhecer hoje. Este guia serve para ajudar os iniciantes em apostas online, lá tem quase tudo que você precisa aprender e entender, se sinta à vontade para receber esse guia de ouro. Deseja continuar?',
        followUp: { options: [
          { text:'Sim', value:101 },
          { text:'Não', value:102 },
          { text:'Voltar ao menu principal', value:0 }
        ] }
      },
      101: {
        answer: `Ótimo! Crie nova conta aqui para verificar:
                 <a href="https://media1.placard.co.mz/redirect.aspx?pid=5905&bid=1690" target="_blank">Criar conta</a><br>
                 E mande comprovante como essa aqui de exemplo:
                 <a href="https://guia-apostas-mz.vercel.app/exemplo.html" target="_blank">Ver exemplo</a>`,
        followUp: { options: [
          { text:'Voltar ao menu principal', value:0 }
        ] },
        showFileInput: true
      },
      102: {
        answer: 'Ok, você pode voltar ao menu.',
        followUp: { options: [
          { text:'Voltar ao menu principal', value:0 }
        ] }
      },
      0: {
        answer: 'Menu principal:',
        followUp: { options: [
          { text:'Quero receber o guia', value:1 },
          { text:'Quero saber sobre este guia', value:2 }
        ] }
      }
    };

    async function processReceipt(file) {
      try {
        const result = await Tesseract.recognize(file, 'por', {
          logger: m => console.log(m)
        });
        return { text: result.data.text };
      } catch (error) {
        throw new Error('Erro ao fazer OCR: ' + error.message);
      }
    }

    function selectQuestion(btn, id) {
      const data = questionsData[id];
      if (!data) return;

      document.querySelectorAll('.question-btn').forEach(b => b.disabled = true);
      const msgs = document.getElementById('messages');

      const um = document.createElement('div');
      um.className = 'message user-message';
      um.textContent = btn.textContent;
      msgs.appendChild(um);
      msgs.scrollTop = msgs.scrollHeight;

      setTimeout(async () => {
        const bm = document.createElement('div');
        bm.className = 'message bot-message';

        if (id === 1) {
          const pos = Math.floor(Math.random() * (368 - 52 + 1)) + 52;
          bm.textContent = `Ótimo, você está na posição ${pos} dos usuários que solicitam o guia hoje, quer continuar?`;
        } else {
          bm.innerHTML = data.answer || '';
        }
        msgs.appendChild(bm);
        msgs.scrollTop = msgs.scrollHeight;

        const q = document.getElementById('questions');
        q.innerHTML = '';

        if (data.showFileInput) {
          const fi = document.createElement('input');
          fi.type = 'file';
          fi.accept = 'image/*';
          fi.id = 'fileInput';
          q.appendChild(fi);

          const sendBtn = document.createElement('button');
          sendBtn.className = 'question-btn';
          sendBtn.textContent = 'Enviar Comprovante';

          sendBtn.onclick = async () => {
            const file = fi.files[0];
            if (!file) return showPopup('Selecione uma imagem antes.');

            fi.disabled = true;
            sendBtn.disabled = true;

            const progressMsg = document.createElement('div');
            progressMsg.className = 'message bot-message';
            progressMsg.innerHTML = `
              <div class="progress-container">
                <div class="progress-text">Processando comprovante...</div>
                <div class="progress-steps">
                  <div class="step uploading active">⏳ Enviando arquivo</div>
                  <div class="progress-bar"><div class="progress-bar-fill" id="barFill"></div></div>
                  <div class="step processing">📷 Analisando imagem</div>
                  <div class="step validating">🔍 Validando dados</div>
                </div>
              </div>
            `;
            msgs.appendChild(progressMsg);
            msgs.scrollTop = msgs.scrollHeight;

            try {
              const { text } = await processReceipt(file);
              progressMsg.querySelector('.processing').classList.add('active');

              const response = await fetch('/api/validate', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
              });

              progressMsg.querySelector('.validating').classList.add('active');
              const result = await response.json();

              progressMsg.remove();

              const finalMsg = document.createElement('div');
              finalMsg.className = 'message bot-message';

              if (result.approved) {
                finalMsg.innerHTML = `✅ Comprovante aprovado! Aqui está o link para baixar o guia: 
                  <a href="${result.guideLink}" target="_blank">Acessar Conteúdo</a>`;
              } else {
                finalMsg.textContent = result.message || 'Erro na validação do comprovante';
              }

              msgs.appendChild(finalMsg);
            } catch (error) {
              progressMsg.remove();
              showPopup(error.message);
              console.error('Erro detalhado:', error);
            } finally {
              selectQuestion(sendBtn, 0);
            }
          };
          q.appendChild(sendBtn);
        }

        data.followUp.options.forEach(opt => {
          const b = document.createElement('button');
          b.className = 'question-btn';
          b.textContent = opt.text;
          b.onclick = () => selectQuestion(b, opt.value);
          q.appendChild(b);
        });
      }, 1000);
    }

    function showPopup(message, duration = 3000) {
      const popup = document.createElement('div');
      popup.className = 'popup';
      popup.textContent = message;
      document.body.appendChild(popup);
      setTimeout(() => popup.remove(), duration);
    }
  </script>
</body>
</html>
